<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · Ayojok</title>
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Poppins:wght@400;500;600&family=Playball&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=5">
</head>
<body data-page="contact">
  <section class="section contact-section">
    <div class="container">
      <div class="contact-card">
        <aside class="contact-info">
          <h1>Contact Information</h1>
          <p class="lead">Say something to start a live chat!</p>
          <ul>
            <li><img src="assets/img/contact/phone.png" alt=""> +880 1303897972</li>
            <li><img src="assets/img/contact/mail.png" alt=""> ayojok@gmail.com</li>
            <li><img src="assets/img/contact/pin.png" alt=""> United City, 100 ft Madani Ave,<br>Dhaka , Bangladesh</li>
          </ul>
          <img class="contact-socials" src="assets/img/contact/socials.png" alt="Twitter, Instagram, Discord">
          <span class="circle red"></span><span class="circle yellow"></span>
        </aside>

        <form class="contact-form" id="contactForm">
          <div class="row2">
            <label>First Name<input name="first" required></label>
            <label>Last Name<input name="last" required></label>
          </div>
          <div class="row2">
            <label>Email<input type="email" name="email" required></label>
            <label>Phone Number<input type="tel" name="phone"></label>
          </div>
          <fieldset>
            <legend>Select Subject?</legend>
            <label class="radio"><input type="radio" name="subject" checked> General Inquiry</label>
            <label class="radio"><input type="radio" name="subject"> Booking Support</label>
            <label class="radio"><input type="radio" name="subject"> Become a Vendor</label>
            <label class="radio"><input type="radio" name="subject"> Feedback</label>
          </fieldset>
          <label class="msg">Message<input name="message" placeholder="Write your message.." required></label>
          <div class="send-row"><button class="btn send">Send Message</button></div>
          <p class="sent" id="sent" hidden>Message Successfully Sent</p>
        </form>
      </div>
    </div>
  </section>

  <script src="assets/js/main.js?v=5"></script>
  <script>
    document.getElementById("contactForm").addEventListener("submit", (e) => {
      e.preventDefault();
      document.getElementById("sent").hidden = false;
      e.target.reset();
    });
  </script>
</body>
</html>
