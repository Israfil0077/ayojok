<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Ayojok</title>
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=6">
</head>
<body class="auth-body">
  <main class="auth">
    <img class="auth-photo" id="authPhoto" src="assets/img/auth/login.jpg" alt="">
    <section class="auth-panel">
      <a class="auth-logo" href="index.html">Ayojok</a>
      <p class="auth-success" id="created" hidden>Your account has been created successfully</p>
      <form class="auth-form" id="loginForm">
        <label>Email<input type="email" name="email" required autocomplete="email"></label>
        <label>Password (8 or more characters)
          <span class="pw"><input type="password" name="password" minlength="8" required autocomplete="current-password">
          <button type="button" class="eye" aria-label="Show password">&#128065;</button></span></label>
        <button class="auth-btn">Let's go</button>
      </form>
      <p class="auth-link"><a href="forgot.html">Forget Password ? <b>Reset</b></a></p>
      <p class="auth-link">New to Ayojok? <a href="signup.html"><b>Sign up</b></a> · <a href="vendor-register.html">Register as a vendor</a></p>
      <p class="auth-terms">By creating Ayojok account you agree to our <a href="about.html">Terms of use</a> and <a href="about.html">Privacy policy</a>.</p>
    </section>
  </main>
  <script type="module" src="assets/js/auth.js?v=2"></script>
</body>
</html>
