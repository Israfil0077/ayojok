<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services · Ayojok</title>
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playball&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=4">
</head>
<body data-page="vendors">
  <section class="hero page-hero">
    <div class="container"><h1>Find vendors for everything</h1><p>Photographers, venues, cakes, DJs, makeup, attire and catering in one place.</p></div>
  </section>

  <section class="section">
    <div class="container">
      <div class="filters" id="filters"></div>
      <div class="vendor-list" id="vendorList"></div>
    </div>
  </section>
  <div class="modal" id="bookModal">
    <form class="panel" data-demo-form="Booking request sent! The vendor will contact you soon. (demo)">
      <h3>Book <span id="bookVendor"></span></h3>
      <label for="b-date">Event date</label><input id="b-date" type="date" required>
      <label for="b-guests">Number of guests</label><input id="b-guests" type="number" min="1" value="200" required>
      <label for="b-note">Message</label><textarea id="b-note" rows="3" placeholder="Tell the vendor about your event"></textarea>
      <div class="form-actions"><button class="btn">Send request</button> <button type="button" class="btn btn-outline" id="closeModal">Close</button></div>
    </form>
  </div>
  <script src="assets/js/main.js?v=4"></script>
</body>
</html>
