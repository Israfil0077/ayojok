<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget calculator · Ayojok</title>
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playball&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=3">
</head>
<body data-page="budget">
  <section class="hero page-hero">
    <div class="container"><h1>Budget calculator</h1><p>See how to split your wedding budget across every category.</p></div>
  </section>

  <section class="section">
    <div class="container grid-2">
      <form class="panel" id="budgetForm" onsubmit="return false">
        <h3>Your wedding</h3>
        <label for="total">Total budget (BDT)</label><input id="total" name="total" type="number" min="0" step="10000" value="1000000">
        <label for="guests">Number of guests</label><input id="guests" name="guests" type="number" min="0" value="300">
        <label for="city">City</label>
        <select id="city"><option>Dhaka</option><option>Chittagong</option><option>Sylhet</option><option>Cox's Bazar</option></select>
        <p class="muted" style="margin-top:18px">The split follows typical wedding spending; adjust the total to see each category update.</p>
      </form>
      <div class="panel">
        <h3>Suggested split</h3>
        <div class="budget-rows" id="budgetRows"></div>
        <div class="budget-total"><span>Total</span><b id="budgetTotal"></b></div>
        <div class="budget-total" style="font-size:16px"><span class="muted">Cost per guest</span><b id="perGuest"></b></div>
        <div class="form-actions"><a class="btn" href="consult.html">Plan it with a consultant</a></div>
      </div>
    </div>
  </section>
  <script src="assets/js/main.js?v=3"></script>
</body>
</html>
